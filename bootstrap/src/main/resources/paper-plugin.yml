name: EmaraLeague
version: '1.0.0'
main: com.emaralabs.emaraleague.EmaraLeaguePlugin
description: Premium Minecraft tournament and events engine
api-version: '1.21'
authors: [Haris]
website: https://emaralabs.com
prefix: EmaraLeague
load: STARTUP

permissions:
  emaraleague.use:
    description: Allows use of EmaraLeague commands
    default: true
  emaraleague.admin:
    description: Allows admin commands
    default: op
  emaraleague.create:
    description: Allows creating tournaments
    default: op
  emaraleague.play:
    description: Allows joining tournaments
    default: true
  emaraleague.reload:
    description: Allows reloading configuration
    default: op
