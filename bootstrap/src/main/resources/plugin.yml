name: EmaraLeague
version: '1.0.0-SNAPSHOT'
main: com.emaralabs.emaraleague.EmaraLeaguePlugin
description: Premium Minecraft tournament and events engine
api-version: '1.21'
author: Haris
authors: [Haris]
website: https://emaralabs.com
prefix: EmaraLeague
load: STARTUP
has-open-classloader: false

commands:
  emaraleague:
    description: EmaraLeague tournament management
    aliases: [el, league]
    permission: emaraleague.use
    usage: /emaraleague <create|join|leave|start|info|help>

permissions:
  emaraleague.use:
    description: Allows use of EmaraLeague commands
    default: true
  emaraleague.admin:
    description: Allows admin commands
    default: op
  emaraleague.create:
    description: Allows creating tournaments
    default: op
  emaraleague.play:
    description: Allows joining tournaments
    default: true
